<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Карты — Resident Card 2.0</title>
        <link rel="stylesheet" href="../css/app.css" />
        <link rel="stylesheet" href="../css/dashboard.css" />
        <link rel="stylesheet" href="../css/section.css" />
    </head>
    <body data-page="cards">
        <div class="bg" aria-hidden="true"><div class="orb"></div><div class="orb"></div><div class="orb"></div><div class="bg-grid"></div></div>
        <div class="cursor-light" aria-hidden="true"></div>

        <div class="section-page">
            <header class="topbar">
                <a href="dashboard.html" class="logo"><div class="logo-mark"></div><span>Resident Card</span></a>
                <div class="user-pill"><div class="avatar"></div><div><strong>Александр</strong></div></div>
            </header>

            <section class="section-hero">
                <div class="tag">Cards</div>
                <h1>Ваши карты</h1>
                <p>Цифровая и физическая карта жителя, QR, NFC и история использования.</p>
            </section>

            <div class="dashboard-main" style="margin-bottom: 48px">
                <div></div>
                <div class="dashboard-visual">
                    <div class="hero-card" style="position: relative; transform: none">
                        <div class="card-inner">
                            <div class="flex-between"><div class="card-chip"></div><div style="font-weight:700">Resident Card</div></div>
                            <div class="card-number">•••• 4589</div>
                            <div class="flex-between"><span>Александр</span><span class="badge badge--success">● Активна</span></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="quick-actions" style="margin-bottom: 48px">
                <button class="chip">📱 Показать QR</button>
                <button class="chip">📡 NFC</button>
                <button class="chip">📋 История</button>
                <button class="chip">⚙️ Настройки</button>
                <button class="chip">🔄 Перевыпуск</button>
            </div>

            <div class="catalog-grid">
                <div class="glass-panel catalog-card reveal">
                    <div class="catalog-card__icon">💳</div>
                    <div class="catalog-card__title">Основная карта</div>
                    <div class="catalog-card__desc">•••• 4589 · Активна с 2024</div>
                    <div class="catalog-card__meta"><span class="badge badge--success">Активна</span></div>
                </div>
                <div class="glass-panel catalog-card reveal">
                    <div class="catalog-card__icon">🎓</div>
                    <div class="catalog-card__title">Студенческая</div>
                    <div class="catalog-card__desc">•••• 7821 · Дополнительная</div>
                    <div class="catalog-card__meta"><span class="badge badge--primary">Подключена</span></div>
                </div>
            </div>
        </div>

        <nav class="dock" aria-label="Навигация">
            <div class="dock-item" data-page="dashboard.html" tabindex="0" aria-label="Главная">🏠</div>
            <div class="dock-item dock-item--active" data-page="cards.html" tabindex="0" aria-label="Карты" aria-current="page">💳</div>
            <div class="dock-item" data-page="benefits.html" tabindex="0" aria-label="Льготы">🎁</div>
            <div class="dock-item" data-page="services.html" tabindex="0" aria-label="Сервисы">🧭</div>
            <div class="dock-item" data-page="profile.html" tabindex="0" aria-label="Профиль">👤</div>
        </nav>
        <script type="module" src="../js/app.js"></script>
    </body>
</html>
