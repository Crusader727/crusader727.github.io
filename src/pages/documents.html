<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Документы — Resident Card 2.0</title>
        <link rel="stylesheet" href="../css/app.css" />
        <link rel="stylesheet" href="../css/dashboard.css" />
        <link rel="stylesheet" href="../css/section.css" />
    </head>
    <body data-page="documents">
        <div class="bg" aria-hidden="true"><div class="orb"></div><div class="orb"></div><div class="orb"></div><div class="bg-grid"></div></div>

        <div class="section-page">
            <header class="topbar">
                <a href="dashboard.html" class="logo"><div class="logo-mark"></div><span>Resident Card</span></a>
            </header>

            <section class="section-hero">
                <div class="tag">Documents</div>
                <h1>Документы</h1>
                <p>Цифровой кошелёк. Все документы в одном месте — просмотр, QR, экспорт.</p>
            </section>

            <div class="catalog-grid">
                <div class="glass-panel catalog-card doc-card reveal">
                    <div class="doc-card__type">Удостоверение личности</div>
                    <div class="doc-card__name">Паспорт</div>
                    <div class="catalog-card__meta"><span class="badge badge--success">✓ Подтверждён</span></div>
                </div>
                <div class="glass-panel catalog-card doc-card reveal">
                    <div class="doc-card__type">Социальный</div>
                    <div class="doc-card__name">СНИЛС</div>
                    <div class="catalog-card__meta"><span class="badge badge--success">✓ Подтверждён</span></div>
                </div>
                <div class="glass-panel catalog-card doc-card reveal">
                    <div class="doc-card__type">Медицина</div>
                    <div class="doc-card__name">Полис ОМС</div>
                    <div class="catalog-card__meta"><span class="badge badge--success">✓ Актуален</span></div>
                </div>
                <div class="glass-panel catalog-card doc-card reveal">
                    <div class="doc-card__type">Налоговый</div>
                    <div class="doc-card__name">ИНН</div>
                    <div class="catalog-card__meta"><span class="badge badge--success">✓ Подтверждён</span></div>
                </div>
                <div class="glass-panel catalog-card doc-card reveal">
                    <div class="doc-card__type">Образование</div>
                    <div class="doc-card__name">Студенческий</div>
                    <div class="catalog-card__meta"><span class="badge badge--primary">Обновлён</span></div>
                </div>
            </div>
        </div>

        <nav class="dock" aria-label="Навигация">
            <div class="dock-item" data-page="dashboard.html" tabindex="0">🏠</div>
            <div class="dock-item" data-page="cards.html" tabindex="0">💳</div>
            <div class="dock-item" data-page="benefits.html" tabindex="0">🎁</div>
            <div class="dock-item" data-page="services.html" tabindex="0">🧭</div>
            <div class="dock-item" data-page="profile.html" tabindex="0">👤</div>
        </nav>
        <script type="module" src="../js/app.js"></script>
    </body>
</html>
