<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Уведомления — Resident Card 2.0</title>
        <link rel="stylesheet" href="../css/app.css" />
        <link rel="stylesheet" href="../css/dashboard.css" />
        <link rel="stylesheet" href="../css/section.css" />
    </head>
    <body data-page="notifications">
        <div class="bg" aria-hidden="true"><div class="orb"></div><div class="orb"></div><div class="orb"></div><div class="bg-grid"></div></div>
        <div class="cursor-light" aria-hidden="true"></div>

        <div class="section-page">
            <header class="topbar">
                <a href="dashboard.html" class="logo"><div class="logo-mark"></div><span>Resident Card</span></a>
                <div class="flex-center" style="gap: 16px">
                    <button class="chip" aria-label="Поиск (Cmd+K)">🔍 Поиск</button>
                    <button class="chip" aria-label="Уведомления">🔔</button>
                    <div class="user-pill"><div class="avatar" aria-hidden="true"></div><div><strong>Александр</strong></div></div>
                </div>
            </header>

            <section class="section-hero">
                <div class="tag">Notifications</div>
                <h1>Уведомления</h1>
                <p>Все события экосистемы — с группировкой, поиском и закреплением важного.</p>
            </section>

            <div class="notification-page__toolbar">
                <input class="notification-page__search" type="search" placeholder="Поиск уведомлений…" aria-label="Поиск уведомлений" />
                <button class="chip" data-action="mark-all-read">Прочитать все</button>
            </div>

            <div class="filter-bar notification-page__filters" role="group" aria-label="Категории">
                <button class="chip chip--active" data-filter="all">Все</button>
                <button class="chip" data-filter="promotions">Акции</button>
                <button class="chip" data-filter="documents">Документы</button>
                <button class="chip" data-filter="benefits">Льготы</button>
                <button class="chip" data-filter="services">Сервисы</button>
                <button class="chip" data-filter="system">Система</button>
            </div>

            <div class="notification-page__list"></div>
        </div>

        <nav class="dock" aria-label="Основная навигация"></nav>

        <div class="command-palette" role="dialog" aria-label="Spotlight Search" aria-hidden="true">
            <div class="command-palette__box">
                <input class="command-palette__input" type="search" placeholder="Поиск по всему продукту…" aria-label="Поиск" />
                <div class="command-palette__hint">↑↓ — навигация · Enter — открыть · Esc — закрыть</div>
            </div>
        </div>

        <script type="module" src="../js/app.js"></script>
    </body>
</html>
